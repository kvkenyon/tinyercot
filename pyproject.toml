[project]
name = "tinyercot"
version = "0.2.2"
description = "Tiny fully-typed ERCOT API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Kevin Kenyon", email = "kevin@poweredbylight.com" },
]

dependencies = [
    "httpx>=0.28.1",
    "httpx-retries>=0.4.5",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
files = [
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]
pdf = ["pypdf>=6.12.0"]

[project.urls]
Homepage = "https://github.com/kvkenyon/tinyercot"
Repository = "https://github.com/kvkenyon/tinyercot"
Issues = "https://github.com/kvkenyon/tinyercot/issues"

[dependency-groups]
dev = [
    "pypdf>=6.12.0",
    "openpyxl>=3.1.5",
    "mypy>=2.3.1",
    "types-openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-xlrd>=2.0.0.20260518",
    "xlrd>=2.0.2",
]


[tool.ruff]
extend-exclude = ["tinyercot/_generated.py"]
